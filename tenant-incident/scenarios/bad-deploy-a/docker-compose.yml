name: bad-deploy-a

services:
  checkout-svc:
    build: ./checkout-svc
    # BUILD selects which build runs. Default is the baseline (healthy); inject.sh
    # recreates this service with BUILD=2026.08.27 to deploy the regression, and
    # reset.sh recreates it with BUILD=2026.08.20 to roll back.
    environment:
      BUILD: ${BUILD:-2026.08.20}
      PORT: "3000"
      REGRESSION_MS: "2500"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
    # Direct access for probing /debug/version and /debug/deploys during a diagnosis.
    ports:
      - "3002:3000"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      checkout-svc:
        condition: service_healthy
    ports:
      - "8082:80"

  # Steady, modest normal traffic. Off by default (profile "inject"); inject.sh
  # starts it before deploying the regression, so the same rate spans the onset.
  loadgen:
    build: ./loadgen
    environment:
      TARGET: "http://gateway:80/checkout/1"
      RATE: "5"
      REQ_TIMEOUT: "10"
    depends_on:
      gateway:
        condition: service_started
    profiles: ["inject"]
    restart: "no"
