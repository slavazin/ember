events {}

http {
    # Log the upstream status so the error rate is legible in the access log: a
    # mix of status=200 and status=500 on /price/* is the presenting symptom.
    log_format storm '$remote_addr "$request" status=$status '
                     'upstream_status=$upstream_status '
                     'req_time=$request_time';
    access_log /dev/stdout storm;

    upstream pricing_upstream {
        server pricing-svc:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://pricing_upstream;
            proxy_connect_timeout 1s;
            # Generous read timeout: the storm here is 5xx errors, not timeouts,
            # so the gateway forwards the service's own status rather than
            # timing out — the shape that distinguishes this from a saturation
            # storm.
            proxy_read_timeout 5s;
            proxy_next_upstream off;
        }
    }
}
