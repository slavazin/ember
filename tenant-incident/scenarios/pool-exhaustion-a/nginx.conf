events {}

http {
    # Log the upstream status and timings so the storm is legible: a 504 with
    # upstream_response_time near the read timeout is the presenting symptom.
    log_format storm '$remote_addr "$request" status=$status '
                     'upstream_status=$upstream_status '
                     'upstream_time=$upstream_response_time req_time=$request_time';
    access_log /dev/stdout storm;

    # A single upstream, no retry-on-timeout: a timed-out request returns 504
    # instead of being silently replayed against another upstream.
    upstream orders_upstream {
        server orders-svc:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://orders_upstream;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_next_upstream off;
        }
    }
}
