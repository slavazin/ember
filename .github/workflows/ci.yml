name: CI

# The review-seam (Constitution Art. 10): every push to main and every pull request runs
# the whole toolchain over the integrated tree — the check no single track branch can run
# in isolation (it is exactly this gap that let a layer/tenant seam bug reach main).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The toolchain runs on Linux and Windows so a platform-assuming test (POSIX permissions,
    # path separators, line endings) fails here instead of on a contributor's machine
    # (blindspot class: platform-assumption). fail-fast: false so one OS failing still reports
    # the other. .gitattributes pins LF, keeping the byte-level gates (gen:check, frozen-path)
    # honest on the Windows checkout.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; lets corpus-lint frozen-path compare against a base ref
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run gen:check # generated store indexes match a fresh render (index-gen --check)
      # The build ADR store (tenant-build/) is self-describing: its own validator gates the ADR
      # entry contract (id==filename, required sections, the supersession pair's reciprocity),
      # keyed off its own SCHEMA. corpus-lint adds only frozen-path immutability and LANGUAGE
      # prose over that store — it does not re-derive the ADR contract (decision 4 / BS-0012).
      - run: npm run adr:check # build ADR store: shape + cross-entry reciprocity (adr check)
      # The incident tenant's case ledger is self-describing too: its own validator gates the INC
      # entry contract (id==filename, the status/forecast-outcome/disposition vocabularies, required
      # sections, superseded-by resolution), keyed off its own SCHEMA. As with the ADR store,
      # corpus-lint adds only frozen-path immutability over it, never the shape (decision 4 / BS-0012).
      - run: npm run incidents:check # incident case ledger: INC entry shape + supersession resolution
      # Frozen-path must diff against the state BEFORE the change, not HEAD against itself. On a
      # PR that base is the PR base; on a push to main it is the pre-push commit. corpus-lint's
      # default (merge-base with origin/main) collapses to HEAD on push-to-main, so pass the base
      # explicitly per event; fetch-depth: 0 above makes both commits reachable. shell: bash so
      # the case statement runs identically on the Windows runner (Git Bash).
      - name: Lint (entry contract, caps, frozen paths, layer/tenant seam)
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            npm run lint                     # new branch / no before-SHA — fall back to default base
          else
            npm run lint -- --base "$base"
          fi

  # ShellCheck gates the shell scripts the TypeScript toolchain never sees — the scenario
  # fixtures (where a bounded poll fell through to a success exit and an unvalidated arg
  # looped) and the host-side tools/ helpers (patch-to-pr.sh, the U1 corpus-deposit path).
  # Blindspot classes: unverified-success, unvalidated-arg. Linux-only: shellcheck is
  # preinstalled on the ubuntu runner; it reads each script's shebang (sh vs bash) itself.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck shell scripts
        run: find tenant-incident/scenarios tools -name '*.sh' -print0 | xargs -0 shellcheck
